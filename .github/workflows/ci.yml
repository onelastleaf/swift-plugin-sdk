name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        swift:
          - "6.2.0"
          - "6.3.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ matrix.swift }}

      - name: Show Swift version
        run: swift --version

      - name: Lint formatting
        run: swift format lint --strict --recursive Package.swift Scripts Sources Tests

      - name: Run tests with warnings as errors
        run: >-
          swift test --disable-automatic-resolution
          -Xswiftc -warnings-as-errors

      - name: Build release with warnings as errors
        run: >-
          swift build --configuration release
          --disable-automatic-resolution
          -Xswiftc -warnings-as-errors

      - name: Validate DocC documentation
        if: matrix.os == 'macos-15' && matrix.swift == '6.3.3'
        shell: bash
        run: |
          swift package dump-symbol-graph \
            --minimum-access-level public \
            --skip-synthesized-members
          symbol_graph_dir="$(find .build -type d -name symbolgraph -print -quit)"
          symbol_graph="$symbol_graph_dir/OnelastleafPluginSDK.symbols.json"
          test -f "$symbol_graph"
          swift Scripts/check-public-api-docs.swift "$symbol_graph"
          docc_symbols=".build/docc-symbols"
          mkdir -p "$docc_symbols"
          cp "$symbol_graph" "$docc_symbols/"
          xcrun docc convert \
            Sources/OnelastleafPluginSDK/OnelastleafPluginSDK.docc \
            --additional-symbol-graph-dir "$docc_symbols" \
            --fallback-display-name OnelastleafPluginSDK \
            --fallback-bundle-identifier org.onelastleaf.swift-plugin-sdk \
            --fallback-default-module-kind Library \
            --output-path .build/docc \
            --warnings-as-errors \
            --experimental-documentation-coverage \
            --coverage-summary-level detailed
